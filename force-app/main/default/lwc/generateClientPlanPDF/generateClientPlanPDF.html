<template>
    <div class="slds-p-around_medium">

        <!-- Idle state -->
        <template lwc:if={isIdle}>
            <div class="slds-media slds-media_center slds-m-bottom_medium">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="doctype:pdf" size="large"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-text-heading_small">Generate Client Plan PDF</h2>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                        Creates a formatted PDF of the Client Plan and attaches it to this account's Files.
                    </p>
                </div>
            </div>
            <div class="slds-grid slds-grid_align-end slds-gutters_small">
                <div class="slds-col slds-grow-none">
                    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                </div>
                <div class="slds-col slds-grow-none">
                    <lightning-button label="Generate &amp; Attach PDF" variant="brand" onclick={handleGenerate}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Loading state -->
        <template lwc:elseif={isLoading}>
            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center loading-area">
                <div class="slds-col" style="text-align:center;">
                    <lightning-spinner alternative-text="Generating PDF..." size="medium"></lightning-spinner>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_large">Generating and attaching PDF…</p>
                </div>
            </div>
        </template>

        <!-- Success state -->
        <template lwc:elseif={isSuccess}>
            <div style="text-align:center;" class="slds-m-bottom_medium">
                <lightning-icon icon-name="action:approval" size="large"></lightning-icon>
                <h3 class="slds-text-heading_small slds-m-top_small">PDF Attached Successfully</h3>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    The Client Plan PDF has been added to the Files section of this account.
                </p>
            </div>
            <div class="slds-grid slds-grid_align-center slds-gutters_small">
                <div class="slds-col slds-grow-none">
                    <lightning-button label="View File" onclick={handleViewFile}></lightning-button>
                </div>
                <div class="slds-col slds-grow-none">
                    <lightning-button label="Close" variant="brand" onclick={handleCancel}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Error state -->
        <template lwc:elseif={isError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
            <div class="slds-grid slds-grid_align-end">
                <div class="slds-col slds-grow-none">
                    <lightning-button label="Close" onclick={handleCancel}></lightning-button>
                </div>
            </div>
        </template>

    </div>
</template>
