<template>
    <section role="dialog" tabindex="-1" aria-modal="true"
             class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <!-- Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                <template lwc:if={helpText}>
                    <p class="slds-text-body_small slds-text-color_inverse-weak slds-m-top_xx-small">
                        {helpText}
                    </p>
                </template>
            </header>

            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium">

                <!-- CREATE RECORD -->
                <template lwc:if={isCreateRecord}>
                    <lightning-record-edit-form
                        object-api-name={targetObject}
                        onsuccess={handleSaveSuccess}
                        onerror={handleSaveError}>
                        <lightning-messages></lightning-messages>
                        <template for:each={layoutFieldNames} for:item="fld">
                            <lightning-input-field
                                key={fld.fieldName}
                                field-name={fld.fieldName}>
                            </lightning-input-field>
                        </template>
                        <div class="slds-m-top_medium">
                            <lightning-button
                                type="submit"
                                variant="brand"
                                label="Save">
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>

                <!-- UPDATE RECORD -->
                <template lwc:elseif={isUpdateRecord}>
                    <lightning-record-edit-form
                        record-id={recordId}
                        object-api-name={objectApiName}
                        onsuccess={handleSaveSuccess}
                        onerror={handleSaveError}>
                        <lightning-messages></lightning-messages>
                        <template for:each={layoutFieldNames} for:item="fld">
                            <lightning-input-field
                                key={fld.fieldName}
                                field-name={fld.fieldName}>
                            </lightning-input-field>
                        </template>
                        <div class="slds-m-top_medium">
                            <lightning-button
                                type="submit"
                                variant="brand"
                                label="Save">
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>

                <!-- VIEW RELATED RECORDS -->
                <template lwc:elseif={isViewRelatedRecords}>
                    <lightning-record-view-form
                        record-id={recordId}
                        object-api-name={objectApiName}>
                        <template for:each={layoutFieldNames} for:item="fld">
                            <lightning-output-field
                                key={fld.fieldName}
                                field-name={fld.fieldName}>
                            </lightning-output-field>
                        </template>
                    </lightning-record-view-form>
                    <div class="slds-m-top_medium slds-align_absolute-center">
                        <lightning-button
                            label="Open Full Record"
                            variant="brand"
                            onclick={handleViewRelated}>
                        </lightning-button>
                    </div>
                </template>

                <!-- VIEW DOCUMENTS -->
                <template lwc:elseif={isViewDocuments}>
                    <template lwc:if={docError}>
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            {docError}
                        </div>
                    </template>
                    <template lwc:elseif={hasDocuments}>
                        <ul class="slds-has-dividers_top-space">
                            <template for:each={documents} for:item="doc">
                                <li key={doc.documentId} class="slds-item slds-p-vertical_x-small">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <div class="slds-col slds-grow">
                                            <lightning-icon
                                                icon-name="doctype:attachment"
                                                size="small"
                                                class="slds-m-right_x-small">
                                            </lightning-icon>
                                            <span class="slds-text-body_regular">{doc.title}</span>
                                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                                                ({doc.fileType} · {doc.fileSizeKb} KB)
                                            </span>
                                        </div>
                                        <div class="slds-col slds-grow-none">
                                            <lightning-button
                                                label="View"
                                                variant="base"
                                                data-doc-id={doc.documentId}
                                                onclick={handleViewDocument}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_regular slds-text-color_weak slds-align_absolute-center slds-p-around_large">
                            No documents attached to this record.
                        </p>
                    </template>
                </template>

                <!-- CREATE TASK -->
                <template lwc:elseif={isCreateTask}>
                    <lightning-record-form
                        object-api-name="Task"
                        layout-type="Compact"
                        mode="edit"
                        onsuccess={handleSaveSuccess}
                        onerror={handleSaveError}>
                    </lightning-record-form>
                </template>

                <!-- CREATE EVENT -->
                <template lwc:elseif={isCreateEvent}>
                    <lightning-record-form
                        object-api-name="Event"
                        layout-type="Compact"
                        mode="edit"
                        onsuccess={handleSaveSuccess}
                        onerror={handleSaveError}>
                    </lightning-record-form>
                </template>

                <!-- LAUNCH FLOW -->
                <template lwc:elseif={isLaunchFlow}>
                    <template lwc:if={flowApiName}>
                        <lightning-flow
                            flow-api-name={flowApiName}
                            flow-input-variables={flowInputVariables}
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_error">No Flow API name configured for this step.</p>
                    </template>
                </template>

                <!-- VIEW HIERARCHY -->
                <template lwc:elseif={isViewHierarchy}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <div style="text-align:center;">
                            <lightning-icon icon-name="utility:hierarchy" size="large"
                                           class="slds-m-bottom_medium"></lightning-icon>
                            <p class="slds-text-body_regular slds-m-bottom_medium">
                                View the full account hierarchy for this record.
                            </p>
                            <lightning-button
                                label="View Hierarchy"
                                variant="brand"
                                onclick={handleViewHierarchy}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer">
                <lightning-button
                    label="Close"
                    variant="neutral"
                    onclick={handleClose}>
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
